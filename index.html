<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TL-B Runtime</title>
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&amp;text=made%20byilr&amp;display=swap">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="app">
      <h1><a target="_blank" href="https://github.com/ilyar/tlb-runtime/commit/5cf275de742b33777ceb87ddbf4e0d5f41e8f3ca">@ton-community/tlb-runtime</a></h1>
      <div class="app-container">
        <div class="form-container">
          <div class="fields-container">
            <div class="field-group schema-field">
              <div class="label-row">
                <label for="schema">TL-B Schema</label>
                <select id="docs-sample" aria-label="Documentation example">
                  <option value="" disabled selected>Sample from docs</option>
                </select>
                <span id="schema-error" class="field-error" style="display: none;"></span>
              </div>
              <a id="sample-source" target="_blank" rel="noopener noreferrer" hidden>Open section in TON Docs ↗</a>
              <textarea name="schema" id="schema" placeholder="TLB schema..."></textarea>
            </div>

            <div class="field-group boc-field">
              <div class="label-row">
                <label for="boc">BoC</label>
                <span id="boc-error" class="field-error" style="display: none;"></span>
              </div>
              <textarea name="boc" id="boc" placeholder="BoC in base64 or hex"></textarea>
              <div id="root-control" hidden>
                <label for="root-type">Decode as</label>
                <select id="root-type"></select>
              </div>
              <div id="root-arguments" hidden></div>
            </div>

            <div class="field-group data-field">
              <div class="label-row">
                <label for="data">Data</label>
                <span id="data-error" class="field-error" style="display: none;"></span>
              </div>
              <textarea name="data" id="data" placeholder="Data in JSON"></textarea>
            </div>
          </div>
        </div>
      </div>
      <footer>
        <a class="signature imprint" href="https://github.com/ilyar/sample-tlb" target="_blank" rel="noopener noreferrer">
          <span class="text"><span class="credit">made by</span><span class="name">ilyar</span></span>
          <img src="./ilyar.svg" width="36" height="36" alt="">
        </a>
      </footer>
    </div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
