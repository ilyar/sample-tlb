<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TL-B Runtime</title>
    <meta name="description" content="Decode a TON BoC to JSON with a TL-B schema, edit the data and encode it back to a BoC">
    <meta property="og:type" content="website">
    <meta property="og:title" content="TL-B Runtime">
    <meta property="og:description" content="Decode a TON BoC to JSON with a TL-B schema, edit the data and encode it back to a BoC">
    <meta property="og:url" content="https://ilyar.github.io/sample-tlb/">
    <meta property="og:image" content="https://ilyar.github.io/sample-tlb/social/preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="600">
    <meta property="og:image:alt" content="TL-B Runtime showing a schema, a BoC with its cells and the decoded JSON">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="TL-B Runtime">
    <meta name="twitter:description" content="Decode a TON BoC to JSON with a TL-B schema, edit the data and encode it back to a BoC">
    <meta name="twitter:image" content="https://ilyar.github.io/sample-tlb/social/preview.png">
    <meta name="twitter:image:alt" content="TL-B Runtime showing a schema, a BoC with its cells and the decoded JSON">
    <link rel="icon" type="image/svg+xml" sizes="any" href="./logo.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./signature.css">
  </head>
  <body>
    <div id="app">
      <h1><img src="./logo.svg?v=3" alt="" width="28" height="28"><a target="_blank" href="https://github.com/ilyar/tlb-runtime/commit/ef997f382660f1078409d58a520dd1a742c7dc9f">TL-B Runtime</a></h1>
      <div class="app-container">
        <div class="form-container">
          <div class="fields-container">
            <div class="field-group schema-field">
              <div class="label-row">
                <span id="schema-label">TL-B Schema</span>
                <select id="docs-sample" aria-label="Documentation example">
                  <option value="" disabled selected>Sample from docs</option>
                </select>
              </div>
              <a id="sample-source" target="_blank" rel="noopener noreferrer" hidden></a>
              <span id="schema-error" class="field-error" aria-live="polite"></span>
              <div class="editor-host" id="schema-editor"></div>
            </div>

            <div class="field-group boc-field">
              <div class="label-row">
                <label for="boc">BoC</label>
                <button type="button" id="share" title="Copy a link to this schema and BoC">Share</button>
              </div>
              <span id="share-status" role="status"></span>
              <input id="share-link" aria-label="Link to copy" readonly hidden>
              <span id="boc-error" class="field-error" aria-live="polite"></span>
              <textarea aria-describedby="boc-error" name="boc" id="boc" placeholder="BoC in base64 or hex"></textarea>
              <details id="cell-inspector" hidden>
                <summary><span>Inspect cells</span><small id="cell-stats"></small></summary>
                <ol id="cell-list"></ol>
              </details>
              <div id="root-control" hidden>
                <label for="root-type">Decode as</label>
                <select id="root-type"></select>
              </div>
              <div id="root-arguments" hidden></div>
            </div>

            <div class="field-group data-field">
              <div class="label-row">
                <span id="data-label">Data</span>
              </div>
              <span id="data-error" class="field-error" aria-live="polite"></span>
              <div class="editor-host" id="data-editor"></div>
            </div>
          </div>
        </div>
      </div>
      <footer class="ilyar-footer">
        <a style="--ilyar-size: 36px" class="ilyar-signature ilyar-colophon" href="https://github.com/ilyar/sample-tlb">
          <span class="ilyar-text"><span class="ilyar-credit">made by</span><span class="ilyar-name">ilyar</span></span>
          <img src="./ilyar.svg" width="36" height="36" alt="">
        </a>
      </footer>
    </div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
